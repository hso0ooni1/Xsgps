<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1525"><title>XS GPS · دمج التطبيقات</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#edf7ff;background:#0b1525;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173b4c,transparent 65%);min-height:100dvh}main{max-width:600px;margin:auto;padding:38px 20px}header{display:flex;align-items:center;gap:14px;margin-bottom:40px}.logo{display:grid;place-items:center;background:#67ebc5;color:#092d29;font-weight:900;border-radius:17px;width:58px;height:58px;font-size:22px}h1{margin:0;font-size:29px}header p{margin:7px 0 0;color:#a5b9cc;font-size:14px}.card{background:#112236;border:1px solid #294055;border-radius:24px;padding:24px}label{display:block;font-size:14px;color:#b5c9da}input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid #395269;background:#0a1929;font-size:16px;margin:9px 0 23px}.drop{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;border:1px dashed #5e928f;min-height:185px;border-radius:18px;padding:22px;text-align:center;cursor:pointer;background:#102c38}.drop:focus-within,.drop.drag{outline:2px solid #67ebc5}.drop strong{font-size:18px;color:#f1fffb;overflow-wrap:anywhere}.drop small{color:#a7c6cd;line-height:1.8}.icon{font-size:34px;color:#67ebc5}.drop input{position:absolute;width:1px;height:1px;opacity:0}button,.download{border:0;border-radius:13px;padding:16px;width:100%;font-size:17px;font-weight:700;cursor:pointer;background:#67ebc5;color:#092b26;margin-top:20px;text-align:center;text-decoration:none;display:block}button:disabled{opacity:.4;cursor:default}.muted{font-size:12px;color:#9eb5c7;line-height:1.9;margin:18px 0 0}#status{margin-top:24px;border-top:1px solid #294055;padding-top:20px}#status[hidden],.download[hidden]{display:none}#detail{font-size:13px;color:#b6cddb;line-height:1.8;overflow-wrap:anywhere;white-space:pre-wrap}progress{width:100%;height:7px;accent-color:#67ebc5;margin:14px 0}#status.error strong{color:#ffb4ad}#status.done strong{color:#67ebc5}#checksum{display:block;direction:ltr;overflow-wrap:anywhere;font-size:10px;color:#99afc3;line-height:1.8;margin-top:12px}.foot{text-align:center;font-size:12px;color:#809aad;margin:23px 0}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}
</style></head><body><main>
<header><div class="logo">XS</div><div><h1 dir="ltr">XS GPS</h1><p>دمج الأداة داخل تطبيقك</p></div></header>
<div class="card"><label for="secret">رمز الدخول</label><input id="secret" type="password" autocomplete="off" placeholder="رمز الدخول الخاص بك">
<label class="drop" id="drop"><span class="icon">↑</span><strong id="filename">اختر التطبيق</strong><small id="fileinfo">APK حتى 140 MB · XAPK حتى 512 MB</small><input id="file" type="file" aria-label="اختيار ملف APK أو XAPK"></label>
<button id="build" disabled>دمج XS GPS</button>
<p class="muted">للتطبيقات التي تملك صلاحية تعديلها. الناتج بتوقيع جديد، ويعمل على أندرويد 8 فأحدث. لتغيير الموقع اختر التطبيق الناتج من إعداد «تطبيق الموقع التجريبي».</p>
<section id="status" hidden aria-live="polite"><strong id="state"></strong><p id="detail"></p><progress id="progress"></progress><a id="download" class="download" hidden>تحميل التطبيق المدمج</a><small id="checksum"></small></section>
</div><p class="foot">APK / XAPK · ملفات الناتج متاحة لمدة ساعة</p></main>
<script>
(()=>{
const $=id=>document.getElementById(id),input=$('file'),button=$('build'),key=$('secret');
let selected=null,busy=false,selection=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function refresh(){button.disabled=busy||!selected||!key.value.trim();input.disabled=busy;key.disabled=busy;}
function show(title,detail='',mode=''){ $('status').hidden=false;$('status').className=mode;$('state').textContent=title;$('detail').textContent=detail;}
async function choose(file){
 if(busy)return;const version=++selection;selected=null;refresh();$('download').hidden=true;$('checksum').textContent='';
 if(!file)return;$('filename').textContent=file.name;
 const match=/\.(apk|xapk)$/i.exec(file.name);
 if(!match){$('fileinfo').textContent='اختر ملف APK أو XAPK';return;}
 const max=match[1].toLowerCase()==='apk'?140:512;
 if(file.size>max*1024*1024||file.size<1024){$('fileinfo').textContent='حجم الملف غير صالح (الحد '+max+' MB)';return;}
 try{const bytes=new Uint8Array(await file.slice(0,4).arrayBuffer());if(version!==selection)return;
 if(bytes[0]!==80||bytes[1]!==75||bytes[2]!==3||bytes[3]!==4)throw Error();
 selected=file;$('fileinfo').textContent=(file.size/1024/1024).toFixed(1)+' MB · جاهز للدمج';
 }catch(e){$('fileinfo').textContent='تعذر قراءة الحزمة؛ نزّل الملف كاملًا ثم اختره';}refresh();
}
input.onchange=()=>choose(input.files[0]);key.oninput=refresh;
for(const name of ['dragover','dragenter'])$('drop').addEventListener(name,e=>{e.preventDefault();if(!busy)$('drop').classList.add('drag')});
for(const name of ['dragleave','drop'])$('drop').addEventListener(name,e=>{e.preventDefault();$('drop').classList.remove('drag')});
$('drop').addEventListener('drop',e=>choose(e.dataTransfer.files[0]));
async function message(response){try{const data=await response.json();return typeof data.detail==='string'?data.detail:'تعذر تنفيذ الطلب';}catch(e){return 'تعذر الاتصال بالسيرفر ('+response.status+')';}}
function upload(file,secret){return new Promise((resolve,reject)=>{
 const xhr=new XMLHttpRequest();xhr.open('POST','/api/build');xhr.setRequestHeader('X-Builder-Key',secret);xhr.timeout=900000;
 xhr.upload.onprogress=e=>{if(e.lengthComputable){$('progress').max=100;$('progress').value=e.loaded/e.total*100;show('جارٍ رفع التطبيق',Math.round(e.loaded/e.total*100)+'٪');}};
 xhr.onload=()=>{let d;try{d=JSON.parse(xhr.responseText)}catch(e){reject(Error('استجابة غير صالحة من السيرفر'));return;}
 xhr.status>=200&&xhr.status<300?resolve(d):reject(Error(typeof d.detail==='string'?d.detail:'تعذر رفع الملف ('+xhr.status+')'));};
 xhr.onerror=()=>reject(Error('انقطع الاتصال أثناء الرفع'));xhr.ontimeout=()=>reject(Error('انتهت مهلة رفع الملف'));
 const body=new FormData();body.append('file',file,file.name);xhr.send(body);
});}
async function monitor(job,secret){
 $('progress').removeAttribute('value');let errors=0;
 for(;;){await sleep(2500);let r;
 try{r=await fetch('/api/status/'+encodeURIComponent(job),{headers:{'X-Builder-Key':secret},cache:'no-store'});}catch(e){if(++errors<12){show('بانتظار الاتصال','مهمة البناء مستمرة على السيرفر');continue;}throw Error('تعذر الاتصال؛ أعد فتح الصفحة وأدخل الرمز لمتابعة المهمة');}
 if(!r.ok){if(r.status===404)sessionStorage.removeItem('xsgps-job');throw Error(await message(r));}
 errors=0;const d=await r.json();show(d.state==='done'?'الملف جاهز':d.state==='failed'?'تعذر الدمج':'جارٍ دمج XS GPS',d.message,d.state==='failed'?'error':d.state==='done'?'done':'');
 if(d.state==='failed'){sessionStorage.removeItem('xsgps-job');return;}
 if(d.state==='done'){const a=$('download');a.href='/api/download/'+encodeURIComponent(job)+'?ticket='+encodeURIComponent(d.download_ticket);a.download=d.output_name;a.hidden=false;$('checksum').textContent='SHA-256: '+d.sha256;sessionStorage.removeItem('xsgps-job');return;}
 }
}
async function execute(resume){if(busy)return;const secret=key.value.trim();if(!secret||(!resume&&!selected))return;busy=true;refresh();$('progress').hidden=false;$('download').hidden=true;$('checksum').textContent='';
 try{if(location.protocol==='file:')throw Error('شغّل المشروع على السيرفر ثم افتح رابطه');
 const job=resume||(await upload(selected,secret)).job;sessionStorage.setItem('xsgps-job',job);await monitor(job,secret);
 }catch(e){show('تعذر إكمال العملية',e.message,'error');}finally{busy=false;$('progress').hidden=true;refresh();}}
button.onclick=()=>execute(null);
const pending=sessionStorage.getItem('xsgps-job');if(pending){show('توجد مهمة سابقة','أدخل رمز الدخول واضغط متابعة');const resume=document.createElement('button');resume.textContent='متابعة المهمة السابقة';resume.onclick=()=>{if(key.value.trim()){resume.remove();execute(pending);}else key.focus();};$('status').appendChild(resume);}
})();
</script></body></html>

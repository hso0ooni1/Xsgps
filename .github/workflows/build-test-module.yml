name: Build XsGPS Test Module
on:
  push:
    branches: [feature/owned-app-module-demo]
    paths:
      - 'android/**'
      - '.github/workflows/build-test-module.yml'
  workflow_dispatch:

jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build demo and module APKs
        shell: bash
        run: |
          cd android
          gradle --no-daemon :app:assembleDebug :xsgpsmodule:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../XsGPS-Demo.apk
          cp xsgpsmodule/build/outputs/apk/debug/xsgpsmodule-debug.apk ../XsGPS-Test-Module.apk
          test -s ../XsGPS-Demo.apk && test -s ../XsGPS-Test-Module.apk
          sha256sum ../XsGPS-Demo.apk ../XsGPS-Test-Module.apk
      - name: Upload demo and module
        uses: actions/upload-artifact@v4
        with:
          name: XsGPS-Module-Demo-APKs
          path: |
            XsGPS-Demo.apk
            XsGPS-Test-Module.apk
          if-no-files-found: error

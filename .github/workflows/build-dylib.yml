name: Build XsGpS dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Build dylib
        run: |
          make clean
          make FINALPACKAGE=1 -j2
          DYLIB="$(find .theos -type f -name 'XsGpS.dylib' | head -n 1)"
          test -n "$DYLIB"
          mkdir -p artifact
          cp "$DYLIB" artifact/XsGpS.dylib
          file artifact/XsGpS.dylib
          shasum -a 256 artifact/XsGpS.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: XsGpS-dylib
          path: artifact/XsGpS.dylib
          if-no-files-found: error

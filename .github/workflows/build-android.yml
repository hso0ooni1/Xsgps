name: Build XsGPS Android APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: |
          cd android
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../XsGPS-Android-debug.apk
          test -s ../XsGPS-Android-debug.apk
          sha256sum ../XsGPS-Android-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: XsGPS-Android-debug-apk
          path: XsGPS-Android-debug.apk
          if-no-files-found: error

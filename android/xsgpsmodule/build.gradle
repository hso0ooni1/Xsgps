plugins { id 'com.android.application' }

android {
    namespace 'com.xsgps.module'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xsgps.module'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1-test'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation project(':xsgpslib')
    // LSPosed/LSPatch supplies these classes at runtime.
    compileOnly 'de.robv.android.xposed:api:82'
}
